[project]
name = "ai-t-agent"
version = "0.1.0"
description = "Personal AI Quant Trading Agent - 日内做T智能交易系统"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "akshare>=1.10",
    "tushare>=1.4",
    "pydantic>=2.0",
    "structlog>=23.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "httpx>=0.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
